<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <link rel="stylesheet" href="error-vr.css" />
</head>
<body>
  <div class="overlay"></div>

  <main class="card">
    <img src="404.png" alt="404 error" class="icon" />

    <h1>Lost in the woods</h1>
    <p class="subtitle">
      The page you’re looking for wandered off with the deer.
    </p>

    <div class="actions">
      <a href="/" class="primary">Go home</a>
      <button onclick="history.back()" class="ghost">Go back</button>
    </div>
  </main>
</body>
</html>
